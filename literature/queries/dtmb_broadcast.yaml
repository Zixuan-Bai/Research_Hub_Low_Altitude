topic: dtmb_uav_control
status: candidate
description: Terrestrial broadcast or DTMB-like one-to-many downlink control for low-altitude UAV management.

seed_keywords:
  - DTMB
  - digital terrestrial multimedia broadcasting
  - UAV command and control
  - broadcast control channel
  - low altitude air traffic management
  - terrestrial broadcast network UAV
  - one-to-many UAV control
  - emergency broadcast UAV
  - cellular broadcast UAV control
  - multicast UAV control

required_terms_any:
  - DTMB
  - UAV
  - UAS
  - drone
  - unmanned aircraft
  - low altitude
  - UTM
  - U-space
  - broadcast control
  - multicast

exclude_terms_any:
