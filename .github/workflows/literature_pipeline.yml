name: Research Intelligence Collection

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic key from configs/pipeline.json, topic slug, or all"
        required: false
        default: "all"
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect research intelligence
        run: python scripts/collect_weekly.py --topic "${{ github.event_name == 'workflow_dispatch' && inputs.topic || 'all' }}"
      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/research-intelligence-${{ github.run_id }}"
          git checkout -b "$branch"
          git add data/items.jsonl outputs/review_dashboard.md
          git commit -m "Update research intelligence items"
          git push -u origin "$branch"
          gh pr create \
            --title "Update research intelligence items" \
            --body "Automated collection. Review data/items.jsonl and outputs/review_dashboard.md before merging. This PR does not make final research claims." \
            --base main \
            --head "$branch"
