name: Literature Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic key from configs/pipeline.json, or all"
        required: false
        default: "all"
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run unattended literature pipeline
        run: python scripts/run_pipeline.py --topic "${{ github.event_name == 'workflow_dispatch' && inputs.topic || 'all' }}"
      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/literature-pipeline-${{ github.run_id }}"
          git checkout -b "$branch"
          git add literature/database/*.csv
          git commit -m "Update automated literature pipeline outputs"
          git push -u origin "$branch"
          gh pr create \
            --title "Update automated literature pipeline outputs" \
            --body "Automated literature metadata search and source-quality review queue update. Review literature/database/review_queue.csv before merging." \
            --base main \
            --head "$branch"
