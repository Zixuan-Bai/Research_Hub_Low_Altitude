name: Validate Hub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - "data/**"
      - "configs/**"
      - "docs/**"
      - "literature/queries/**"
      - "notes/**"
      - "outputs/**"
      - "scripts/**"
      - "topics/**"
      - "AGENTS.md"
      - "README.md"
      - "requirements.txt"
      - "codex_refactor_request_low_altitude_research_hub.md"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate hub skeleton
        run: python scripts/validate_hub.py
      - name: Compile scripts
        run: python -m py_compile scripts/research_hub_lib.py scripts/batch_read_pdfs.py scripts/collect_weekly.py scripts/read_item.py scripts/review_app.py scripts/synthesize_topic.py scripts/validate_hub.py
      - name: Dry-run weekly collection
        run: python scripts/collect_weekly.py --topic remote_id --dry-run
      - name: Dry-run topic synthesis
        run: python scripts/synthesize_topic.py --topic remote_id --dry-run
